<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sayının Karesi</title>
</head>
<body>
    <h2>Sayının Karesini Hesaplama</h2>
    <input type="number" id="sayiInput" placeholder="Bir sayı girin">
    <button onclick="karesiHesapla()">Hesapla</button>
    <p id="sonuc"></p>

    <script>
        function karesiHesapla() {
            let sayi = Number(document.getElementById("sayiInput").value);
            let kare = sayi * sayi;
            document.getElementById("sonuc").innerText = "Sayının Karesi: " + kare;
        }
    </script>
</body>
</html>
